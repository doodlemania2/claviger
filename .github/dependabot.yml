version: 2
updates:
  # Actions are pinned to full commit SHAs (a tag can be moved to malicious code).
  # Dependabot bumps the SHA and its version comment together. Its PRs are notices
  # only: CI skips them (see the job guards in the workflows); label a PR `run-ci`
  # to test it. Security updates and alerts stay on.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
