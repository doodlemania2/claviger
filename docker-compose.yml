services:
  claviger:
    build:
      context: .
      args:
        - VERSION=dev
    container_name: claviger
    restart: unless-stopped
    environment:
      PB_HOST: 0.0.0.0
      PB_PORT: 8090
      # Optional: auto-create superuser on startup
      # PB_ADMIN_EMAIL: admin@example.com
      # PB_ADMIN_PASSWORD: changeme123
      # Optional: encrypt the settings record (exactly 32 characters; generate with: openssl rand -hex 16).
      # entrypoint.sh passes --encryptionEnv=PB_ENCRYPTION_KEY only when this is set.
      # PB_ENCRYPTION_KEY: ""
      # Optional: Litestream backup to Azure Blob Storage
      # LITESTREAM_REPLICA_URL: abs://pocketbase-backups
      # LITESTREAM_ACCESS_KEY_ID: <storage-account-name>
      # LITESTREAM_SECRET_ACCESS_KEY: <storage-account-key>
    ports:
      - "8090:8090"
    volumes:
      - ./pb_data:/pb_data
      - ./pb_public:/pb_public
      - ./pb_hooks:/pb_hooks
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
