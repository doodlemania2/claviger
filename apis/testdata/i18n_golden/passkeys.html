<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passkeys</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/passkeys/assets/passkeys-page.css">
<link rel="stylesheet" href="/a11y/a11y-mode.css">
<script src="/a11y/a11y-mode.js"></script>
</head>
<body>
<a class="skip" href="#app">Skip to the main content</a>
<header class="a11y-bar"><button type="button" id="a11yToggle" class="a11y-toggle" aria-pressed="false" hidden>Larger text and high contrast</button></header>

<main class="card" id="app" tabindex="-1">
<h1>Passkeys</h1>
<p class="muted">Sign in with a passkey, or add one on this device.</p>

<div id="msg"></div>

<section id="anon" aria-labelledby="anonHeading">
  <h2 id="anonHeading">Sign in with a passkey</h2>
  <label for="identity">Email or username</label>
  <input type="text" id="identity" autocomplete="username webauthn">
  <div id="captchaBox" hidden></div>
  <button type="button" id="btnLogin">Sign in with passkey</button>
  <div id="loginMsg"></div>
  <p class="muted hint" id="pwHint">
    No passkey yet? <button type="button" class="linklike" id="linkPasswordLogin" aria-controls="pwForm" aria-expanded="false">Sign in with your password to add one.</button>
  </p>

  <div id="recovery" hidden>
    <p class="muted hint">
      Lost your passkey, or is this your first time?
      <button type="button" class="linklike" id="linkRecovery" aria-controls="recoveryForm" aria-expanded="false">Email me a link to set one up.</button>
    </p>
    <div id="recoveryForm" hidden>
      <label for="recoveryEmail">Email</label>
      <input type="email" id="recoveryEmail" autocomplete="email">
      <button type="button" id="btnRecovery">Send link</button>
      <div id="recoveryMsg"></div>
    </div>
  </div>

  <div id="pwForm" hidden>
    <hr>
    <h2>Sign in with password</h2>
    <label for="pwEmail">Email</label>
    <input type="email" id="pwEmail" autocomplete="username">
    <label for="pwPass">Password</label>
    <input type="password" id="pwPass" autocomplete="current-password">
    <button type="button" id="btnPwLogin">Sign in</button>
    <div id="pwMsg"></div>
  </div>
</section>

<section id="authed" aria-labelledby="authedHeading" hidden>
  <h2 id="authedHeading">Your passkeys</h2>
  <p>Signed in as <strong id="me"></strong>. <button type="button" class="linklike" id="linkLogout">Sign out</button></p>
  <button type="button" id="btnRegister">Add a passkey on this device</button>
  <ul class="creds" id="creds"></ul>
</section>
</main>

<script type="module" src="/passkeys/assets/passkeys-page.js"></script>
</body>
</html>
