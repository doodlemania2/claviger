name: Test

on:
  pull_request:
    branches: [master]
  push:
    # deploy/azure is only ever fast-forwarded to a master commit that already passed here.
    branches: [master]
  # Runs CI on purpose on any branch, Dependabot's included.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run. Master runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runners: trusted runs (pushes, workflow_dispatch, PRs from branches of this repo) use
# our k3s pool. A PR from a fork runs code we have not reviewed, so it never reaches our
# runners, which sit inside our network: it runs on GitHub-hosted runners instead.
# Outside contributors' runs also need approval first (repo setting).

jobs:
  test:
    timeout-minutes: 60
    # Dependabot PRs are notices and never run CI; label one `run-ci` to test it.
    # docker-build needs this job, so it is skipped too.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci')
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || (vars.RUNNER_LIGHT || 'tdp-k3s-claviger') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        # The apis package alone runs past go test's default 10m on the k3s runners.
        run: go test -timeout 40m ./... -v --cover

      - name: Run KMS key source tests (AWS KMS and Google Cloud KMS build tags)
        run: go test -tags kms_aws,kms_gcp -count=1 ./tools/keys/...

      - name: Run linter
        # golangci.yml is schema `version: "2"`, which requires golangci-lint v2
        # (action v7+). The old action@v6 installs v1 and fails to parse it.
        # Upstream v0.40.0 renamed the `gomodguard` linter to `gomodguard_v2`,
        # which v2.6.2 rejects ("unknown linters: 'gomodguard_v2'") -- that name
        # needs golangci-lint >= v2.12.0. Keep the pin on a release built with at
        # least the Go that `go-version-file: go.mod` resolves to (1.27.2 from the
        # v0.40.5 sync): v2.13.2 (built with 1.27.0) fails every package with
        # "export data version 5 is greater than maximum supported version 4".
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          args: -c ./golangci.yml

  # PostgreSQL storage (#106): the tagged integration tests and the regular suites against a
  # real server. Runs after `test` so a broken SQLite suite stops here first.
  #
  # A matrix over the supported majors. 16 is the minimum and runs on every PR and push. 17
  # (the newest major we test) runs on pushes to master and manual runs only: the two legs run
  # in parallel, so the wall time is the same, and skipping 17 on PRs halves the CI minutes of
  # a PR run (the suites take about 20 minutes per leg on the k3s runners). A 17-only
  # regression therefore shows up on master, one merge late, which is the accepted trade.
  postgres:
    name: postgres ${{ matrix.pg }}
    timeout-minutes: 100
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || (vars.RUNNER_LIGHT || 'tdp-k3s-claviger') }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Pinned to patch releases (the newest of each major on 2026-11-08, from the official
        # image tags on Docker Hub); bump by hand: Dependabot does not scan workflow service
        # images. Keep the 16 entry at the lowest major we support.
        pg: ${{ fromJSON(github.event_name == 'pull_request' && '["16.15"]' || '["16.15", "17.11"]') }}
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: pb
          POSTGRES_PASSWORD: pb
          POSTGRES_DB: pbtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pb -d pbtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLAVIGER_TEST_PG_URL: postgres://pb:pb@localhost:5432/pbtest?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # -v and the count check below: a skipped package (CLAVIGER_TEST_PG_URL
      # unset or unreachable) exits 0 and would verify nothing.
      #
      # The known SQLite/Postgres differences (docs/datastores.md) are skipped on
      # purpose, as tests named known_gap/...: they are listed in the log with the
      # reason. Any other skip fails the job, and so does a run that passes too few
      # tests (the suite has ~420 passing cases; a green that ran nothing is a failure).
      - name: Run Postgres tests
        run: |
          set -o pipefail
          go test -tags postgres -count=1 -v ./tests/pgtests/... | tee pg-test.log
          echo "known gaps (skipped on purpose):"
          grep -- '--- SKIP' pg-test.log | grep -- 'known_gap' || true
          if grep -- '--- SKIP' pg-test.log | grep -qv -- 'known_gap'; then
            echo "::error::a Postgres test was skipped"
            exit 1
          fi
          test "$(grep -c -- '--- PASS' pg-test.log)" -ge 430

      # The regular core, apis, oidc, cmd, forms, mails and jsvm suites on Postgres: the test
      # fixture is converted to a template database (tests/app_postgres.go) and every test app
      # is a clone of it. The tests in tests/postgres_skip.txt (SQLite specific expectations,
      # each with its reason) are the only ones skipped, any other skip fails the job, and so
      # does a run that passes too few tests or one that ran on SQLite.
      - name: Run the regular suites on Postgres
        run: scripts/test_postgres_suites.sh

      # Several replicas on one database (#106, M7): the bus, the advisory-lock cron guard, the
      # webhook delivery claim, and an N-app harness (realtime across replicas, cache and session
      # invalidation, shared auth rate limits, concurrent start). Every test runs against this
      # server; a skipped test fails the step, and so does a run that ran nothing.
      - name: Run the multi-replica suite
        run: |
          set -o pipefail
          go test -tags postgres -count=1 -v -run 'MultiReplica|TestBus|TestRunExclusive|TestRateHit|TestCeremony|TestEnsureSchema' \
            ./tests/pgtests/... ./core ./tools/replica/... | tee mr-test.log
          if grep -q -- '--- SKIP' mr-test.log; then
            echo "::error::a multi-replica test was skipped"
            exit 1
          fi
          test "$(grep -c -- '--- PASS' mr-test.log)" -ge 18

      # migrate-db end to end with the real binary (#106, M5): a SQLite pb_data is copied into a
      # fresh database of this server, and the same records are read back through the API of a
      # server that runs on CLAVIGER_DB_URL. The package tests of migrate-db (fixture, every fork
      # feature, resume, refusals) already ran in the suites above.
      - name: migrate-db smoke test
        run: scripts/test_migrate_db_smoke.sh

  # Browser end-to-end tests (e2e/): the admin UI and the hosted pages (/passkeys, /oidc/*,
  # /orgs/*) driven in Chromium against a real binary. Master pushes and manual runs only:
  # never on a PR (a PR does not need ~10 minutes of browser time per push).
  #
  # The Playwright version is pinned in e2e/package.json; `playwright install` fetches the
  # matching Chromium build (about 150 MB), so a runner that cannot reach the Playwright CDN
  # fails here with the download error.
  e2e:
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    runs-on: ${{ vars.RUNNER_LIGHT || 'tdp-k3s-claviger' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Install the e2e dependencies and the pinned browser
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          # --with-deps installs the system libraries (apt; sudo when not root)
          npx playwright install --with-deps chromium

      # Builds ./examples/base itself (global-setup.ts) and starts it on a temp data dir.
      - name: Run the browser tests
        working-directory: e2e
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.run/server.log
          retention-days: 7

  docker-build:
    timeout-minutes: 15
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || (vars.RUNNER_LIGHT || 'tdp-k3s-claviger') }}
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # entrypoint.sh carries the data-integrity invariant; lint it and the
      # scripts that test it. Pinned image tag, same version as `make shellcheck`
      # expects locally (0.11.0).
      - name: Shellcheck entrypoint and scripts
        run: |
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck-alpine:v0.11.0 \
            shellcheck entrypoint.sh scripts/*.sh

      # Opt-in settings encryption: --encryptionEnv reaches claviger iff
      # PB_ENCRYPTION_KEY is set, and a wrong-length key stops the start.
      - name: Settings encryption flag
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w alpine:3 \
            sh -c 'TEST_SH=sh sh scripts/test_entrypoint_encryption.sh'

      # Field-encryption key pre-flight (#75): only an explicit "keys check: FAILED"
      # blocks the start, before the handover request; everything else fails open.
      - name: Field-key pre-flight
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w alpine:3 \
            sh -c 'TEST_SH=sh sh scripts/test_entrypoint_keys_preflight.sh'

      # entrypoint.sh's handover scenarios (#35, #54) under the shell prod
      # actually runs — busybox ash in alpine — with util-linux flock. T3 replays
      # the transition from whatever deploy/azure currently deploys, and skips
      # itself once that script already has the #54 ack.
      - name: Handover scenarios under busybox
        run: |
          git fetch --depth=1 origin deploy/azure
          git show FETCH_HEAD:entrypoint.sh > "$RUNNER_TEMP/entrypoint.deployed.sh"
          docker run --rm -v "$PWD:/w:ro" -v "$RUNNER_TEMP/entrypoint.deployed.sh:/tmp/old.sh:ro" -w /w alpine:3 \
            sh -c 'apk add --no-cache flock procps-ng >/dev/null && TEST_SH=sh sh scripts/test_entrypoint_handover.sh /tmp/old.sh'

      - name: Build Docker image
        run: docker build -t claviger:test .

      - name: Smoke test container
        run: |
          docker run -d --name pb-test -p 8090:8090 claviger:test
          sleep 5
          curl -sf http://localhost:8090/api/health || (docker logs pb-test && exit 1)
          docker logs pb-test 2>&1 | grep -q "single writer confirmed" \
            || (echo "entrypoint did not confirm single-writer ownership"; docker logs pb-test; exit 1)
          docker stop pb-test

      # Regression test for #35. A rolling Container Apps revision transition
      # runs two replicas against one /pb_data for ~40s, which corrupted
      # auxiliary.db five times. The incoming replica cannot simply block —
      # readiness gates the handover in both directions, and blocking deadlocks
      # the rollout (b7642f75, reverted). So the OUTGOING replica must leave on
      # its own when asked. That is what this asserts.
      - name: Rollout handover leaves a single writer on the volume
        run: |
          docker volume create pb-handover-test
          docker run -d --name pb-old -v pb-handover-test:/pb_data claviger:test
          for _ in $(seq 30); do
            if docker logs pb-old 2>&1 | grep -q "single writer confirmed"; then break; fi
            sleep 1
          done
          docker logs pb-old 2>&1 | grep -q "single writer confirmed" \
            || (echo "first replica never took the volume"; docker logs pb-old; exit 1)

          docker run -d --name pb-new -v pb-handover-test:/pb_data claviger:test
          for _ in $(seq 60); do
            if docker logs pb-new 2>&1 | grep -q "single writer confirmed"; then break; fi
            sleep 1
          done

          docker logs pb-new 2>&1 | grep -q "single writer confirmed" \
            || (echo "incoming replica never took over"; docker logs pb-new; docker logs pb-old; exit 1)
          docker logs pb-old 2>&1 | grep -q "handover requested" \
            || (echo "outgoing replica ignored the handover request"; docker logs pb-old; exit 1)
          docker logs pb-old 2>&1 | grep -q "Parking until this replica is drained" \
            || (echo "outgoing replica did not park"; docker logs pb-old; exit 1)

          # It must PARK, not exit. An exit reads as a crash to Container Apps,
          # which restarts the container; that restart then races the incoming
          # replica for the lock and can win it.
          test "$(docker inspect -f '{{.State.Running}}' pb-old)" = "true" \
            || (echo "outgoing replica exited instead of parking"; docker logs pb-old; exit 1)
          test "$(docker inspect -f '{{.State.Running}}' pb-new)" = "true" \
            || (echo "incoming replica is not running"; docker logs pb-new; exit 1)

          # The runtime image is alpine with busybox pgrep (no procps); its -f takes an ERE.
          # Match the binary and its compat symlink so these checks cannot pass vacuously.
          # Parked means it really let go: no claviger process left in it.
          if docker exec pb-old pgrep -f '/usr/local/bin/(claviger|pocketbase)' >/dev/null 2>&1; then
            echo "outgoing replica parked but still runs claviger — the volume was never released"
            docker logs pb-old; exit 1
          fi

          # A parked replica fails its liveness probe, so ACA restarts it in
          # place (same hostname) — the #54 zombie. It must park again, not
          # take /pb_data back from the replica now serving.
          docker restart -t 5 pb-old
          for _ in $(seq 20); do
            if docker logs pb-old 2>&1 | grep -q "already handed /pb_data over"; then break; fi
            sleep 1
          done
          docker logs pb-old 2>&1 | grep -q "already handed /pb_data over" \
            || (echo "restarted outgoing replica did not park"; docker logs pb-old; exit 1)
          if docker exec pb-old pgrep -f '/usr/local/bin/(claviger|pocketbase)' >/dev/null 2>&1; then
            echo "restarted outgoing replica is running claviger again — two writers"
            docker logs pb-old; exit 1
          fi
          docker logs pb-new 2>&1 | grep -q "handover requested" \
            && (echo "serving replica answered the zombie's request"; docker logs pb-new; exit 1)
          docker exec pb-new pgrep -f '/usr/local/bin/(claviger|pocketbase)' >/dev/null \
            || (echo "serving replica stopped after the zombie restart"; docker logs pb-new; exit 1)

          # And it still answers SIGTERM once ACA finally drains it.
          docker stop -t 20 pb-old
          test "$(docker inspect -f '{{.State.ExitCode}}' pb-old)" = "0" \
            || (echo "parked replica did not shut down cleanly"; docker logs pb-old; exit 1)

          docker rm -f pb-old pb-new
          docker volume rm pb-handover-test

  # Master is the one trunk and the source of deploy/azure: a red push
  # there means the next sync or deploy starts broken. PR failures already show on the
  # PR, so only push events notify.
  notify-failure:
    # Push events only, so always trusted.
    runs-on: ${{ vars.RUNNER_LIGHT || 'tdp-k3s-claviger' }}
    timeout-minutes: 5
    needs: [test, docker-build]
    if: >-
      always() && github.event_name == 'push' && contains(needs.*.result, 'failure') &&
      (github.event.pull_request.user.login != 'dependabot[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'run-ci'))
    steps:
      # Failure notice -> ntfy, when the NTFY_URL secret is set.
      # NTFY_URL is the FULL publish URL including the topic and ?auth=..., so it is a
      # repo SECRET (never a variable). A notice that cannot be
      # delivered must never turn into a second failure, hence the unconditional exit 0.
      - name: Notify ntfy on failure
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "::warning::NTFY_URL secret is not set; no failure notice was sent."
            exit 0
          fi
          curl -sS -m 15 --retry 2 -X POST "$NTFY_URL" \
            -H "Title: claviger CI FAILED on ${GITHUB_REF_NAME}" \
            -H "Priority: high" \
            -H "Tags: x,test_tube" \
            -H "Click: $RUN_URL" \
            -d "${GITHUB_REPOSITORY} ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}: the Test workflow failed on push. $RUN_URL" >/dev/null \
            || echo "::warning::ntfy notification could not be delivered."
          exit 0
