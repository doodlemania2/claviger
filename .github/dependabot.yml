version: 2
updates:
  # Actions are pinned to full commit SHAs (a tag can be moved to malicious code).
  # Dependabot bumps the SHA and its version comment together, in one grouped PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Majors are reviewed deliberately, by hand, not proposed by Dependabot.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
