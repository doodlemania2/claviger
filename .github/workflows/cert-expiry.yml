name: Certificate expiry watch

# The Container Apps managed certificate renews itself, so this should never fire.
# It exists because a renewal that quietly fails is invisible until sign-in breaks for
# every parish app (the CNAME/asuid validation behind the managed cert can lapse).

on:
  schedule:
    - cron: '30 9 * * 1'  # Mondays 09:30 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  HOST: auth.stfoafrisco.org
  WARN_DAYS: 21

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fail when the served certificate expires soon
        run: |
          end=$(echo | openssl s_client -connect "$HOST:443" -servername "$HOST" 2>/dev/null \
                  | openssl x509 -noout -enddate | cut -d= -f2)
          if [ -z "$end" ]; then
            echo "::error::could not read a certificate from $HOST:443"
            exit 1
          fi
          left=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "$HOST certificate expires $end ($left days)"
          echo "DAYS_LEFT=$left" >> "$GITHUB_ENV"
          if [ "$left" -lt "$WARN_DAYS" ]; then
            echo "::error::$HOST certificate expires in $left days (threshold $WARN_DAYS)"
            exit 1
          fi

      # Failure notice -> self-hosted ntfy (https://alert.thedoodleproject.net).
      # NTFY_URL is the FULL publish URL including the topic and ?auth=..., so it is a
      # repo SECRET (see the Alerting block in CLAUDE.md). A notice that cannot be
      # delivered must never turn into a second failure, hence the unconditional exit 0.
      - name: Notify ntfy on failure
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "::warning::NTFY_URL secret is not set; no failure notice was sent."
            exit 0
          fi
          curl -sS -m 15 --retry 2 -X POST "$NTFY_URL" \
            -H "Title: auth.stfoafrisco.org certificate check FAILED" \
            -H "Priority: high" \
            -H "Tags: lock,warning" \
            -H "Click: $RUN_URL" \
            -d "The served certificate is expiring (${DAYS_LEFT:-unknown} days left) or unreadable. The managed cert should renew itself; check the custom-domain binding and DNS validation. $RUN_URL" >/dev/null \
            || echo "::warning::ntfy notification could not be delivered."
          exit 0
