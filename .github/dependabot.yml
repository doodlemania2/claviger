version: 2
updates:
  # Actions are pinned to full commit SHAs (a tag can be moved to malicious code).
  # Dependabot bumps the SHA and its version comment together, in one grouped PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        # Majors arrive as separate PRs, each evaluated on its own.
        update-types: ["minor", "patch"]
